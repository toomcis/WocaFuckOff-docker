# Example docker-compose configuration for the bot service
# Build the image from the local Dockerfile and pass through
# some of the environment variables declared in the Dockerfile.
# Code also doesn't need any mounted volumes, everything works dynamically through volumes
#
# Usage:
#   docker-compose up --build
#
version: "3.8"

services:
  wocabee:
    build: .
    container_name: wocabee_bot
    restart: unless-stopped
    ports:
      - "5900:5900"           # VNC access
      - "9222:9222"           # Chromium remote debugging
    environment:
      - TARGET_URL=${TARGET_URL}
      - WORDLIST_FILE=${WORDLIST_FILE}
      - PICTURE_FILE=${PICTURE_FILE}
      - PLACEHOLDER_WORDS=${PLACEHOLDER_WORDS}
      - NTFY_SERVER=${NTFY_SERVER}
      - NTFY_TOPIC=${NTFY_TOPIC}
      - NTFY_TOKEN=${NTFY_TOKEN}
    tty: true
    stdin_open: true
